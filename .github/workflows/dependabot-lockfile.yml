name: Update Dependabot Lockfile

on:
  push:
    branches:
      - 'dependabot/**'

concurrency:
  group: dependabot-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-lockfile:
    name: Update pnpm lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit and push if lockfile changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo "Lockfile already up to date"
          else
            git commit -m "chore(deps): update pnpm lockfile"
            git push
          fi
